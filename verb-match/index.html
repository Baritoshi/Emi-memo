<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verb Matching Game</title>
    <!-- Link to the CSS -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h1>Verb Matching Game</h1>
        <p>Add your verbs, then match them correctly!</p>

        <!-- Input Form -->
        <div id="input-section">
            <h2>Add Verbs</h2>
            <form id="add-verbs-form">
                <textarea id="verbs-input"
                          placeholder="Format: infinitive,past,participle,translation (one per line)"></textarea>
                <button type="submit">Add Verbs</button>
            </form>
        </div>

        <!-- Game Section -->
        <div id="game-section" style="display: none;">
            <!-- Lives Display -->
            <div class="lives-container">
                <p>Lives: <span id="lives-display">5</span></p>
                <div id="hearts-container"></div>
            </div>

            <!-- Target Slots -->
            <div class="targets" id="targets"></div>

            <!-- Word Selection -->
            <div class="draggables" id="draggables"></div>

            <!-- Controls -->
            <div class="controls">
                <button id="check-answers">Check Answers</button>
                <button id="restart-game">Restart Game</button>
            </div>
        </div>
    </div>

    <!-- Link to your JavaScript -->
    <script src="app.js"></script>
</body>
</html>
