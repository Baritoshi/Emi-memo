<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verb Drag-and-Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Verb Drag-and-Drop Game</h1>
        <p>Add your verbs, then drag the correct forms to their matching slots!</p>

        <!-- Input Form Section -->
        <div id="input-section">
            <h2>Add Verbs</h2>
            <form id="add-verbs-form">
                <textarea id="verbs-input" placeholder="Format: infinitive,past,participle,translation (one per line)"></textarea>
                <button type="submit">Add Verbs</button>
            </form>
        </div>

        <!-- Game Section -->
        <div id="game-section" style="display: none;">
            <div class="game">
                <div id="targets" class="targets"></div>
                <div id="draggables" class="draggables"></div>
            </div>

            <div class="controls">
                <button id="check-answers">Check Answers</button>
            </div>

            <button id="restart-game">Restart Game</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
