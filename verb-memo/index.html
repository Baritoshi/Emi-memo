<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="iso-8859-2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verb Matcher</title>
    <link rel="stylesheet" href="styles_autumn.css">
</head>
<body>
    <div class="container">
        <h1>Verb Matcher</h1>
        <p>Match the three forms of the verb and its Polish translation!</p>
        <div id="game-board" class="game-board"></div>

        <div class="score">
            <p>Score: <span id="score">0</span></p>
        </div>

        <button id="restart-game">Restart Game</button>

        <div id="options-menu">
            <h2>Add Verbs</h2>
            <form id="add-verbs-form">
                <label for="verbs-input">Enter verbs (format: infinitive,past,past participle,translation):</label><br>
                <textarea id="verbs-input" rows="5" placeholder="e.g., go,went,gone,ić"></textarea><br>
                <button type="submit">Save Verbs</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
